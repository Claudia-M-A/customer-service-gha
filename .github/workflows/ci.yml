name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: customerdb
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d customerdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: customerdb
      DB_USERNAME: ${{secrets.POSTGRES_DB_USERNAME}}
      DB_PASSWORD: ${{secrets.POSTGRES_DB_PASSWORD}}
      API_USERNAME: ${{secrets.API_USERNAME}}
      API_PASSWORD: ${{ format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Build application
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/*.xml
          if-no-files-found: warn
